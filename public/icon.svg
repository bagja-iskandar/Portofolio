<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Square Container for Browser Tab Favicon -->
  <rect width="100" height="100" rx="24" fill="#0E0D0C"/>
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="#C4975A" stroke-opacity="0.35" stroke-width="3"/>
  
  <!-- Letter 'b': Ascender & Rounded Bowl -->
  <path d="M 28 20 L 28 68" stroke="#C4975A" stroke-width="7" stroke-linecap="round"/>
  <path d="M 28 44 C 36 44, 48 48, 48 56 C 48 64, 36 68, 28 68" stroke="#C4975A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter 'i': Central Stem & Tittle Dot -->
  <path d="M 52 44 L 52 68" stroke="#C4975A" stroke-width="7" stroke-linecap="round"/>
  <circle cx="52" cy="30" r="5" fill="#EDE8DF"/>
  
  <!-- Letter 'j': Shoulder and Continuous Joy Smile Arc -->
  <path d="M 60 50 C 62 44, 72 42, 74 48 L 74 64 C 74 78, 58 86, 42 78" stroke="#C4975A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
