<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Threshold Dual Seam Container (Diagonal Seam) -->
  <defs>
    <clipPath id="diagonalSeam">
      <polygon points="0,0 100,0 0,100"/>
    </clipPath>
  </defs>
  
  <rect width="100" height="100" rx="22" fill="#F5F2EB"/>
  <rect width="100" height="100" rx="22" fill="#0E0D0C" clip-path="url(#diagonalSeam)"/>
  <rect x="1" y="1" width="98" height="98" rx="21" stroke="#C4975A" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Letter 'b': Ascender & Rounded Bowl -->
  <path d="M 28 20 L 28 68" stroke="#C4975A" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 28 44 C 36 44, 48 48, 48 56 C 48 64, 36 68, 28 68" stroke="#C4975A" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter 'i': Central Stem & Radiant Dot -->
  <path d="M 52 44 L 52 68" stroke="#C4975A" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="52" cy="30" r="4.5" fill="#EDE8DF"/>
  
  <!-- Letter 'j': Shoulder and Continuous Joy Smile Arc -->
  <path d="M 60 50 C 62 44, 72 42, 74 48 L 74 64 C 74 78, 58 86, 42 78" stroke="#C4975A" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
