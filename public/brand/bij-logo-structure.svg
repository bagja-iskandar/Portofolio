<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Structure Blueprint Dark Container -->
  <rect width="100" height="100" rx="22" fill="#0E0D0C"/>
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#D4A366" stroke-opacity="0.35" stroke-width="3"/>
  
  <!-- Letter 'b': Ascender & Rounded Bowl -->
